# Weekly visual and form check of the selected deployment's sites, with one summary email (scripts/weekly/check.ts).
# gate (no install, no secrets) reads the deployment's weeklyCheck.enabled flag; check runs only when it is true.
# Expressions never reach shell code: every value a step needs arrives through its own `env:`.
# The repository variable DEPLOYMENT selects deployments/<name>/. A missing or invalid selection, or a selection whose
# configured repository is not this one, fails the gate. No main-only guard (plan D4), so a test branch runs the same jobs.
name: weekly-check

on:
  schedule:
    - cron: "0 15 * * 5"
      timezone: "Europe/Zagreb"
  workflow_dispatch:

permissions: {}

env:
  DEPLOYMENT: ${{ vars.DEPLOYMENT }}

concurrency:
  group: weekly-check
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - id: gate
        name: Gate
        run: bun --no-env-file --no-install scripts/weekly/gate.ts >> "$GITHUB_OUTPUT"

  check:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Native tools
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends build-essential python3 gnupg zip unzip
      - name: Dependencies
        run: bun --no-env-file install --frozen-lockfile
      - name: Chromium
        run: bunx playwright install --with-deps chromium
      - name: Weekly check
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_FOLDER: ${{ secrets.IMAP_FOLDER }}
          IMAP_SPAM_FOLDER: ${{ secrets.IMAP_SPAM_FOLDER }}
          FORM_TEST_ADDRESS: ${{ secrets.FORM_TEST_ADDRESS }}
          FORM_TEST_TOKEN: ${{ secrets.FORM_TEST_TOKEN }}
        run: bun --no-env-file scripts/weekly/check.ts
