# Sites and pages checked at desktop (1440) and mobile (390).
# Picked on 2026-09-25 from each site's sitemap: the home page, every hand-built
# page with its own layout, one example per template (post, product, project,
# category...), and one page per distinct form. Comments note forms found
# (GF = Gravity Forms, Fluent = Fluent Forms, id in the plugin).
# form_helper stays false until the pirax-form-test plugin is installed on that site.
# test_form: the one form per site that is filled each run (and, with form_helper: true,
# submitted at most once); every other form is reported skipped, never filled or submitted.
# A site without test_form has all its forms skipped. Never designate a login/registration form.

sites:
  - slug: suntos
    url: https://suntos.de
    form_helper: false                 # helper 0.3.1, marked test 2026-10-09: awaiting-audit
    hide: ['.brx-popup', '.brx-popup-backdrop', '.wcpay-express-checkout-wrapper']   # timed pop-ups; Apple/Google Pay buttons load late
    max_diff_pixel_ratio: 0.02                     # lazy product images settle slightly differently
    test_form: { page: /kontakt/, plugin: fluent, id: 4 }
    pages:
      - /
      - /shop/
      - /product/belle/
      - /journal/
      - /qualitaets-und-kaufberater-fuer-sonnenbrillen/
      - /review/tino-m/
      - /about/
      - /manufacturing/
      - /faq/
      - /agb/
      - /kontakt/                       # Fluent #4

  - slug: stolarijabanek
    url: https://stolarijabanek.com
    form_helper: true                  # helper 0.3.1 installed 2026-10-07
    max_diff_pixel_ratio: 0.02                     # lazy images settle slightly differently on mobile
    test_form: { page: /kontakt/, plugin: fluent, id: 1 }
    pages:
      - path: /
        mask: ['.content-2__img', '.content-3__col .bg-image']   # lazy-loaded images are captured at different load stages
      - /o-nama/
      - /usluge/
      - /usluge/kuhinje/
      - path: /galerija/
        mask: ['.g-gallery-1__gallery']           # isotope gallery reflows while images load
      - /kontakt/                       # Fluent #1

